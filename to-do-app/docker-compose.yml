version: "3.9"

services:
  taskflow:
    build: .
    container_name: taskflow-app
    ports:
      - "5000:5000"
    volumes:
      - todo-data:/app/data
    environment:
      - FLASK_ENV=production
      - DATA_FILE=/app/data/todos.json
    restart: unless-stopped

volumes:
  todo-data:
    driver: local
