<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taskflow</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a35;
    --accent: #f0c060;
    --accent2: #e07050;
    --text: #e8e8f0;
    --muted: #7070a0;
    --low: #50d080;
    --medium: #f0c060;
    --high: #e07050;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 50%, #1a1020 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, #101520 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* Header */
  header {
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease both;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    font-weight: 900;
    letter-spacing: -2px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }

  .tagline {
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 6px;
    font-weight: 300;
  }

  /* Stats bar */
  .stats {
    display: flex;
    gap: 32px;
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }

  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }

  /* Add form */
  .add-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 32px;
    animation: fadeUp 0.6s ease 0.1s both;
  }

  .add-section h2 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    margin-bottom: 20px;
    color: var(--accent);
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .form-row-inline {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  input, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }

  select option { background: var(--surface2); }

  .add-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    color: #0d0d0f;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    width: 100%;
    margin-top: 8px;
    letter-spacing: 0.5px;
    transition: opacity 0.2s, transform 0.15s;
  }

  .add-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .add-btn:active { transform: translateY(0); }

  /* Filters */
  .filters {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    animation: fadeUp 0.6s ease 0.15s both;
  }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 8px 18px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #0d0d0f; font-weight: 500; }

  /* Todo list */
  .todos-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    animation: fadeUp 0.6s ease 0.2s both;
  }

  .todos-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
  }

  .sort-select {
    width: auto;
    padding: 8px 12px;
    font-size: 13px;
  }

  #todo-list { display: flex; flex-direction: column; gap: 10px; }

  .todo-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    transition: border-color 0.2s, transform 0.15s;
    animation: slideIn 0.3s ease both;
  }

  .todo-item:hover { border-color: #3a3a50; transform: translateX(3px); }
  .todo-item.completed { opacity: 0.5; }
  .todo-item.completed .todo-title { text-decoration: line-through; color: var(--muted); }

  .checkbox {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .checkbox:hover { border-color: var(--accent); }
  .todo-item.completed .checkbox { background: var(--accent); border-color: var(--accent); }
  .todo-item.completed .checkbox::after { content: '✓'; font-size: 12px; color: #0d0d0f; font-weight: 700; }

  .todo-body { flex: 1; min-width: 0; }
  .todo-title { font-size: 15px; font-weight: 500; margin-bottom: 8px; word-break: break-word; }

  .todo-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .tag {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 50px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .priority-low { background: #50d08020; color: var(--low); }
  .priority-medium { background: #f0c06020; color: var(--medium); }
  .priority-high { background: #e0705020; color: var(--high); }

  .tag-category {
    background: #5060f020;
    color: #8090e0;
  }

  .due-date {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .due-date.overdue { color: var(--high); }

  .todo-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }

  .icon-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }

  .icon-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .icon-btn.delete:hover { border-color: var(--high); color: var(--high); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 15px; }

  /* Animations */
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }

  @media (max-width: 600px) {
    .form-row-inline { grid-template-columns: 1fr; }
    .logo { font-size: 36px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Taskflow</div>
    <div class="tagline">Your tasks, beautifully organized</div>
    <div class="stats">
      <div class="stat"><span class="stat-num" id="stat-total">0</span><span class="stat-label">Total</span></div>
      <div class="stat"><span class="stat-num" id="stat-pending">0</span><span class="stat-label">Pending</span></div>
      <div class="stat"><span class="stat-num" id="stat-done">0</span><span class="stat-label">Done</span></div>
    </div>
  </header>

  <div class="add-section">
    <h2>New Task</h2>
    <div class="form-row">
      <input type="text" id="title" placeholder="What needs to be done?" />
    </div>
    <div class="form-row-inline" style="margin-top:12px">
      <select id="priority">
        <option value="low">🟢 Low Priority</option>
        <option value="medium" selected>🟡 Medium Priority</option>
        <option value="high">🔴 High Priority</option>
      </select>
      <input type="text" id="category" placeholder="Category (e.g. Work, Personal)" />
      <input type="date" id="due_date" />
    </div>
    <button class="add-btn" onclick="addTodo()">+ Add Task</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('pending', this)">Pending</button>
    <button class="filter-btn" onclick="setFilter('completed', this)">Completed</button>
    <button class="filter-btn" onclick="setFilter('high', this)">🔴 High</button>
    <button class="filter-btn" onclick="setFilter('medium', this)">🟡 Medium</button>
    <button class="filter-btn" onclick="setFilter('low', this)">🟢 Low</button>
  </div>

  <div class="todos-header">
    <h2>Tasks</h2>
    <select class="sort-select" onchange="renderTodos()">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="priority">By priority</option>
      <option value="due">By due date</option>
    </select>
  </div>

  <div id="todo-list"></div>
</div>

<script>
let todos = [];
let currentFilter = 'all';

async function fetchTodos() {
  const res = await fetch('/api/todos');
  todos = await res.json();
  renderTodos();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTodos();
}

function getFiltered() {
  return todos.filter(t => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'pending') return !t.completed;
    if (currentFilter === 'completed') return t.completed;
    return t.priority === currentFilter;
  });
}

function getSorted(items) {
  const sort = document.querySelector('.sort-select').value;
  return [...items].sort((a, b) => {
    if (sort === 'newest') return b.id - a.id;
    if (sort === 'oldest') return a.id - b.id;
    if (sort === 'priority') {
      const p = { high: 0, medium: 1, low: 2 };
      return p[a.priority] - p[b.priority];
    }
    if (sort === 'due') {
      if (!a.due_date) return 1;
      if (!b.due_date) return -1;
      return a.due_date.localeCompare(b.due_date);
    }
  });
}

function renderTodos() {
  const list = document.getElementById('todo-list');
  const items = getSorted(getFiltered());

  document.getElementById('stat-total').textContent = todos.length;
  document.getElementById('stat-pending').textContent = todos.filter(t => !t.completed).length;
  document.getElementById('stat-done').textContent = todos.filter(t => t.completed).length;

  if (items.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="emoji">✨</div><p>No tasks here. Add one above!</p></div>`;
    return;
  }

  list.innerHTML = items.map(t => {
    const today = new Date().toISOString().split('T')[0];
    const overdue = t.due_date && t.due_date < today && !t.completed;
    return `
    <div class="todo-item ${t.completed ? 'completed' : ''}" id="todo-${t.id}">
      <div class="checkbox" onclick="toggleTodo(${t.id})"></div>
      <div class="todo-body">
        <div class="todo-title">${escapeHtml(t.title)}</div>
        <div class="todo-meta">
          <span class="tag priority-${t.priority}">${t.priority.toUpperCase()}</span>
          ${t.category ? `<span class="tag tag-category">${escapeHtml(t.category)}</span>` : ''}
          ${t.due_date ? `<span class="due-date ${overdue ? 'overdue' : ''}">📅 ${formatDate(t.due_date)}${overdue ? ' · Overdue' : ''}</span>` : ''}
        </div>
      </div>
      <div class="todo-actions">
        <button class="icon-btn delete" onclick="deleteTodo(${t.id})">✕</button>
      </div>
    </div>`;
  }).join('');
}

function formatDate(d) {
  const [y, m, day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[parseInt(m)-1]} ${parseInt(day)}`;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function addTodo() {
  const title = document.getElementById('title').value.trim();
  if (!title) { document.getElementById('title').focus(); return; }
  const body = {
    title,
    priority: document.getElementById('priority').value,
    category: document.getElementById('category').value.trim() || 'General',
    due_date: document.getElementById('due_date').value
  };
  const res = await fetch('/api/todos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const todo = await res.json();
  todos.unshift(todo);
  document.getElementById('title').value = '';
  document.getElementById('due_date').value = '';
  renderTodos();
}

async function toggleTodo(id) {
  const todo = todos.find(t => t.id === id);
  const res = await fetch(`/api/todos/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ completed: !todo.completed })
  });
  const updated = await res.json();
  todos = todos.map(t => t.id === id ? updated : t);
  renderTodos();
}

async function deleteTodo(id) {
  await fetch(`/api/todos/${id}`, { method: 'DELETE' });
  todos = todos.filter(t => t.id !== id);
  renderTodos();
}

document.getElementById('title').addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

fetchTodos();
</script>
</body>
</html>
